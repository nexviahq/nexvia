name: Nexvia CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install Dependencies
      working-directory: frontend
      run: npm install

    - name: Run Lint
      working-directory: frontend
      run: npm run lint

    - name: Build Application
      working-directory: frontend
      run: npm run build
