name: Nexvia CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Check frontend package manifest
      id: frontend-package
      run: |
        if [ -f frontend/package.json ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
          echo "Skipping frontend build because frontend/package.json is missing."
        fi

    - name: Install Dependencies
      if: steps.frontend-package.outputs.exists == 'true'
      working-directory: frontend
      run: npm install

    - name: Run Lint
      if: steps.frontend-package.outputs.exists == 'true'
      working-directory: frontend
      run: npm run lint

    - name: Build Application
      if: steps.frontend-package.outputs.exists == 'true'
      working-directory: frontend
      run: npm run build
